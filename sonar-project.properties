sonar.projectKey=project-nexus
sonar.projectName=Project Nexus
sonar.sources=backend/src,frontend/src,packages/types/src
sonar.tests=backend/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/prisma/migrations/**,**/*.d.ts,frontend/src/mocks/**,**/*.test.ts,**/*.test.tsx,**/*.test.mjs
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.app.json,packages/types/tsconfig.json
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
