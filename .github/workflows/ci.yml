name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Build, and Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint and SonarJS
        run: npm run lint

      - name: Check frontend i18n parity
        run: npm run i18n:check

      - name: Validate documentation and OpenAPI spec
        run: npm run docs:check

      - name: Validate Prisma schema
        run: npx prisma validate --schema=backend/prisma/schema.prisma

      - name: Build all workspaces
        run: npm run build

      - name: Run automated test suites
        run: npm test
