name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Build, and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_ci
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-key-at-least-32-chars
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret-key-at-least-32-chars
      CORS_ORIGINS: http://localhost:5173
      APP_PUBLIC_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
      NEXUS_AFTER_SALES_DB_TEST: '1'
      NEXUS_BACKEND_REVIEW_DB_TEST: '1'
      NEXUS_BANNER_DB_TEST: '1'
      NEXUS_CHATBOT_DB_TEST: '1'
      NEXUS_DOCUMENT_GAPS_DB_TEST: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Without --legacy-peer-deps: the tree resolves on its own, and the flag
        # was hiding whether it still did.
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint and SonarJS
        run: npm run lint

      - name: Check frontend i18n parity
        run: npm run i18n:check

      - name: Validate documentation and OpenAPI spec
        run: npm run docs:check

      - name: Validate Prisma schema
        run: npx prisma validate --schema=backend/prisma/schema.prisma

      - name: Check backend import graph for cycles
        run: npm run check:cycles

      - name: Build all workspaces
        run: npm run build

      - name: Typecheck backend tests
        run: npm run typecheck:test --workspace=nexus-backend

      - name: Typecheck frontend tests
        run: npm run typecheck:test --workspace=nexus-frontend

      - name: Typecheck database seeds
        run: npm run typecheck:seeds --workspace=nexus-backend

      - name: Deploy Prisma migrations for integration tests
        run: npm run prisma:deploy --workspace=nexus-backend

      - name: Bootstrap system rows
        run: npm run db:bootstrap

      - name: Verify database CHECK constraints and partial indexes
        run: npm run db:verify

      - name: Run automated test suites
        run: npm test

      - name: Check the committed OpenAPI spec is current
        # The spec is generated from the controllers and committed, so the docs
        # site and any client generated from it describe what the server does.
        # Nothing stopped the two drifting: the file was regenerated by hand,
        # and for a while it was missing eighteen routes that existed.
        run: |
          npm run docs:openapi
          if ! git diff --quiet -- docs/static/openapi/nexus-openapi.json; then
            echo 'The committed OpenAPI spec does not match the controllers.'
            echo 'Run `npm run docs:openapi` and commit the result.'
            git --no-pager diff --stat -- docs/static/openapi/nexus-openapi.json
            exit 1
          fi

      - name: Collect coverage
        # Reported, not gated: a threshold picked now would be a number nobody
        # agreed to, and a build that fails on it teaches people to raise it.
        run: |
          npm run test:coverage --workspace=nexus-backend
          npm run test:coverage --workspace=nexus-frontend

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            backend/coverage/lcov.info
            frontend/coverage/lcov.info
          if-no-files-found: warn

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the shared packages
        # The front end imports @nexus/types and @nexus/contracts from their
        # built output, so the dev server cannot start without them.
        run: |
          npm run build --workspace=@nexus/types
          npm run build --workspace=@nexus/contracts

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # The suite has existed since the first milestone and nothing ran it, so a
      # route that stopped rendering — or an i18n key that stopped resolving —
      # reached review unnoticed. Playwright starts the dev server itself.
      - name: Run the browser smoke tests
        run: npm run test:e2e:smoke

      - name: Upload the report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/report
          retention-days: 7

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Built, not pushed. A Dockerfile that no longer builds is a deployment
      # that fails at the worst moment, and nothing here used to check.
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          target: migrator
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the compose files
        run: |
          docker compose -f infra/docker-compose.yml config --quiet
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.demo.yml config --quiet
