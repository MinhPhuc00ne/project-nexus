name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_ci
      JWT_SECRET: ci-test-jwt-secret-key-at-least-32-chars
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret-key-at-least-32-chars
      CORS_ORIGINS: http://localhost:5173
      APP_PUBLIC_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Turbo and lint state
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            .eslintcache
            .prettiercache
          key: static-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            static-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'turbo.json') }}-
            static-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint and SonarJS
        run: npm run lint

      - name: Check frontend i18n parity
        run: npm run i18n:check

      - name: Validate documentation and OpenAPI spec
        run: npm run docs:check

      - name: Validate Prisma schema
        run: npx prisma validate --schema=backend/prisma/schema.prisma

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check backend import graph for cycles
        run: npm run check:cycles

      - name: Build all workspaces
        run: npm run build

      - name: Typecheck all workspaces, tests, and seeds
        run: npm run typecheck

      - name: Check the committed OpenAPI spec is current
        run: |
          npm run docs:openapi
          if ! git diff --quiet -- docs/static/openapi/nexus-openapi.json; then
            echo 'The committed OpenAPI spec does not match the controllers.'
            echo 'Run `npm run docs:openapi` and commit the result.'
            git --no-pager diff --stat -- docs/static/openapi/nexus-openapi.json
            exit 1
          fi

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_ci
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-key-at-least-32-chars
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret-key-at-least-32-chars
      CORS_ORIGINS: http://localhost:5173
      APP_PUBLIC_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
      NEXUS_AFTER_SALES_DB_TEST: '1'
      NEXUS_BACKEND_REVIEW_DB_TEST: '1'
      NEXUS_BANNER_DB_TEST: '1'
      NEXUS_CHATBOT_DB_TEST: '1'
      NEXUS_DOCUMENT_GAPS_DB_TEST: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Turbo state
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build shared packages
        run: npm run build:contracts

      - name: Deploy Prisma migrations for integration tests
        run: npm run db:deploy

      - name: Bootstrap system rows
        run: npm run db:bootstrap

      - name: Verify database CHECK constraints and partial indexes
        run: npm run db:verify

      - name: Run backend tests with coverage
        run: |
          npm run test:coverage --workspace=nexus-backend
          npm run test:legacy --workspace=nexus-backend

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: warn

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Turbo state
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:contracts

      - name: Run frontend tests with coverage
        run: npm run test:coverage --workspace=nexus-frontend

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: warn

  e2e:
    name: Browser Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Turbo state
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:contracts

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the browser smoke tests
        run: npm run test:e2e:smoke

      - name: Upload the report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/report
          retention-days: 7

  changes:
    name: Detect Container Paths
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'infra/**'
              - 'backend/**'
              - 'frontend/**'
              - 'packages/**'
              - 'package*.json'
              - '.github/workflows/ci.yml'

  images:
    name: Container Images Build
    needs: changes
    if: github.ref == 'refs/heads/main' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          target: migrator
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the compose files
        run: |
          docker compose -f infra/docker-compose.yml config --quiet
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.demo.yml config --quiet
