name: Feature Request
description: Propose a new feature or enhancement for Project Nexus
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Explain the problem or limitation this feature solves.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the expected behavior, API changes, or UI updates.
    validations:
      required: true
