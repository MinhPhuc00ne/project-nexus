[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/Dockerfile.backend"
dockerBuildTarget = "runner"
watchPatterns = ["backend/**", "packages/**", "infra/docker/Dockerfile.backend", "package.json", "package-lock.json", "railway.toml"]

[deploy]
preDeployCommand = "npx prisma migrate deploy --schema=prisma/schema.prisma && node dist/prisma/seeds/system.js"
healthcheckPath = "/api/v1/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
